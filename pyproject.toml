[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loja-aurora-analytics"
version = "1.0.0"
description = "Análise de dados de e-commerce (dados fictícios) com MySQL e Python"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
aurora = "aurora.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]   # permite rodar o pytest sem instalar o pacote
markers = ["mysql: exige um MySQL acessível pelas variáveis do .env"]

[tool.pyright]
extraPaths = ["src"]   # o editor (Pylance) encontra o pacote aurora em src/
