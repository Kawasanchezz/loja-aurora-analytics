version: 2
updates:
  # Atualizações e alertas de segurança das bibliotecas Python
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Mantém as ações do GitHub Actions (fixadas por hash) atualizadas
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
