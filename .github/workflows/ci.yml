name: CI e segurança

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # toda segunda: detecta vulnerabilidades novas nas dependências

# Menor privilégio: o fluxo só pode ler o repositório.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes-e-seguranca:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Banco descartável, criado só durante a execução e destruído no fim.
    # As senhas são geradas por execução (id da execução) e valem só para ele; não são credenciais reais.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root-${{ github.run_id }}-${{ github.run_attempt }}  # pragma: allowlist secret
          MYSQL_DATABASE: aurora_test
          MYSQL_USER: aurora
          MYSQL_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}  # pragma: allowlist secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: aurora          # banco "principal" (nunca tocado pelos testes)
      MYSQL_USER: aurora
      MYSQL_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}  # pragma: allowlist secret
      AURORA_TEST_DATABASE: aurora_test

    steps:
      # Ações fixadas por hash de commit (a tag pode ser movida; o hash não).
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install bandit pip-audit

      - name: Análise estática de segurança (Bandit)
        run: python -m bandit -r src

      - name: Vulnerabilidades conhecidas nas dependências (pip-audit)
        run: python -m pip_audit -r requirements.txt

      - name: Testes (inclui integração com o MySQL descartável)
        run: python -m pytest -q
